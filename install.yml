# install.yml - declares what Tethys should install when someone runs
# `tethys install -d` from this directory.
#
# Strategy
# --------
# All runtime dependencies (scientific stack, FIMserv pinned to a git ref,
# teehr, awscli) are declared in `pyproject.toml` and installed with pip.
# Tethys installs the app itself with `pip install -e .`, which resolves
# that list regardless of flags (`-w` only skips the section below), so
# declaring packages here as well would be redundant. Nothing is installed
# via conda anymore; a plain `pip install -e .` also works outside Tethys.

version: 1.1
tethys_version: ">=4.0.0"
name: fimserve_viewer

requirements:
  skip: false

  conda:
    channels:
      - conda-forge
    packages: []

  pip: []

  # (no npm packages)
  npm:

# (no post-install hook: Tethys installs the app with `pip install -e .`,
# which already resolves the full pyproject.toml dependency set)
